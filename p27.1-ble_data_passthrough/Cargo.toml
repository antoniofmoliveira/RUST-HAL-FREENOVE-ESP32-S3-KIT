[package]
name = "bas-peripheral"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bas-peripheral"
path = "./src/bin/main.rs"
test = false
bench = false

[dependencies]
esp-radio = { version = "0.18.0", features = [
    "ble",
    "log-04",
    "unstable",
    "esp32",
] }
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
esp-alloc = { version = "0.10.0", features = ["esp32"] }
esp-backtrace = { version = "0.19.0", features = [
    "panic-handler",
    "println",
    "esp32",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal = { version = "1.1.0", features = ["log-04", "unstable", "esp32"] }
esp-println = { version = "0.17.0", features = ["log-04", "esp32"] }
esp-rtos = { version = "0.3.0", features = [
    "esp-radio",
    "embassy",
    "log-04",
    "esp32",
] }
log = "0.4.33"
trouble-host = { version = "0.7.0", features = [
    "default-packet-pool-mtu-255",
    "derive",
    "scan",
] }
static_cell = "2.1.1"

[patch.crates-io]
esp-alloc = { git = "https://github.com/embassy-rs/esp-hal.git", rev = "b7eec0f" }
esp-backtrace = { git = "https://github.com/embassy-rs/esp-hal.git", rev = "b7eec0f" }
esp-bootloader-esp-idf = { git = "https://github.com/embassy-rs/esp-hal.git", rev = "b7eec0f" }
esp-hal = { git = "https://github.com/embassy-rs/esp-hal.git", rev = "b7eec0f" }
esp-println = { git = "https://github.com/embassy-rs/esp-hal.git", rev = "b7eec0f" }
esp-radio = { git = "https://github.com/embassy-rs/esp-hal.git", rev = "b7eec0f" }
esp-rtos = { git = "https://github.com/embassy-rs/esp-hal.git", rev = "b7eec0f" }
esp-storage = { git = "https://github.com/embassy-rs/esp-hal.git", rev = "b7eec0f" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3de" }

[profile.dev]
opt-level = "s"

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = 's'

[package.metadata.cargo-machete]
# static_cell is used indirectly in #[gatt_service] macro.
ignored = ["embassy-sync", "static_cell"]
